<!DOCTYPE html>
<html lang="ko">
<head>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계약직원 면접 평가 시스템</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCa9KHSlThpYcpgXHnwI6J6UkA-Q-vCzpg",
    authDomain: "syu-interview.firebaseapp.com",
    databaseURL: "https://syu-interview-default-rtdb.firebaseio.com",
    projectId: "syu-interview",
    storageBucket: "syu-interview.firebasestorage.app",
    messagingSenderId: "90039452918",

  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window._fbDb = db;
  window._fbRef = ref;

  window._fbUpdate = update;
  window._fbRemove = remove;
  window._fbReady = true;

  window.dispatchEvent(new Event('firebaseReady'));
</script>
<style>
  :root {
    --navy: #1a2744;
    --navy-mid: #243560;
    --navy-light: #2f4480;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --cream: #f8f6f0;
    --white: #ffffff;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-300: #d1d5db;
    --gray-400: #9ca3af;
    --gray-500: #6b7280;
    --gray-600: #4b5563;
    --gray-700: #374151;
    --gray-800: #1f2937;
    --red: #dc2626;
    --green: #16a34a;
    --blue: #2563eb;
    --shadow: 0 4px 24px rgba(26,39,68,0.10);
    --shadow-lg: 0 8px 40px rgba(26,39,68,0.16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Pretendard', sans-serif;
    background: var(--cream);
    color: var(--gray-800);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .header {
    background: var(--navy);
    color: white;
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    border-bottom: 2px solid var(--gold);
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header-logo {
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: 1px;
  }
  .header-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.2); }
  .header-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  #projectTitle {
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.9);
    border: none;
    background: transparent;
    outline: none;
    min-width: 300px;
    cursor: pointer;
  }
  #projectTitle:focus {
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    padding: 2px 8px;
    cursor: text;
  }
  .edit-icon { font-size: 12px; color: var(--gold); opacity: 0.7; }
  .header-right { display: flex; align-items: center; gap: 10px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 6px; font-size: 13px;
    font-family: 'Pretendard', sans-serif;
    font-weight: 500; cursor: pointer; border: none; transition: all 0.15s;
  }
  .btn-gold { background: var(--gold); color: var(--navy); }
  .btn-gold:hover { background: var(--gold-light); }
  .btn-outline { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); }
  .btn-outline:hover { background: rgba(255,255,255,0.1); }
  .btn-navy { background: var(--navy-mid); color: white; }
  .btn-navy:hover { background: var(--navy-light); }
  .btn-red { background: #fee2e2; color: var(--red); border: 1px solid #fca5a5; }
  .btn-red:hover { background: #fecaca; }
  .btn-green { background: var(--green); color: white; }
  .btn-green:hover { background: #15803d; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  .tab-bar {
    background: var(--navy-mid);
    display: flex;
    gap: 0;
    flex-shrink: 0;
  }
  .tab {
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab.active { color: var(--gold-light); border-bottom-color: var(--gold); }
  .tab:hover:not(.active) { color: rgba(255,255,255,0.85); }

  .main { display: flex; flex: 1; overflow: hidden; }

  .sidebar {
    width: 240px;
    background: var(--white);
    border-right: 1px solid var(--gray-200);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--gray-200);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-title { font-size: 12px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px; }
  .applicant-list { flex: 1; overflow-y: auto; padding: 8px; }

  .applicant-card {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 4px;
    border: 1.5px solid transparent;
    position: relative;
  }
  .applicant-card:hover { background: var(--gray-50); }
  .applicant-card.active { background: #eef2ff; border-color: var(--blue); }
  .applicant-card.evaluated { border-left: 3px solid var(--green); }

  .applicant-name { font-size: 14px; font-weight: 600; color: var(--gray-800); }
  .applicant-meta { font-size: 11px; color: var(--gray-500); margin-top: 2px; }
  .applicant-badge {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    font-weight: 600;
    margin-top: 4px;
  }
  .badge-labor { background: #fef3c7; color: #92400e; }
  .badge-office { background: #dbeafe; color: #1e40af; }
  .badge-research { background: #d1fae5; color: #065f46; }
  .badge-bohun { background: #fce7f3; color: #9d174d; margin-left: 4px; }

  .card-actions {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    display: none; gap: 4px;
  }
  .applicant-card:hover .card-actions { display: flex; }
  .icon-btn {
    width: 24px; height: 24px; border-radius: 4px; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 12px; transition: all 0.15s;
  }
  .icon-btn-edit { background: var(--gray-100); color: var(--gray-600); }
  .icon-btn-edit:hover { background: #dbeafe; color: var(--blue); }
  .icon-btn-del { background: var(--gray-100); color: var(--gray-600); }
  .icon-btn-del:hover { background: #fee2e2; color: var(--red); }

  .sidebar-footer { padding: 12px; border-top: 1px solid var(--gray-200); display: flex; flex-direction: column; gap: 6px; }

  .content { flex: 1; display: flex; overflow: hidden; }

  .eval-view { display: flex; width: 100%; }

  .pdf-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--gray-200);
    background: var(--gray-100);
  }
  .pdf-panel-header {
    padding: 12px 16px;
    background: white;
    border-bottom: 1px solid var(--gray-200);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .pdf-panel-title { font-size: 13px; font-weight: 600; color: var(--gray-700); }
  .pdf-container { flex: 1; overflow: auto; display: flex; flex-direction: column; }
  #pdfViewer { width: 100%; height: 100%; border: none; }
  .pdf-placeholder {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--gray-400);
    gap: 12px;
  }
  .pdf-placeholder svg { width: 48px; height: 48px; opacity: 0.5; }
  .pdf-placeholder p { font-size: 14px; }

  .eval-panel {
    width: 420px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: white;
    overflow: hidden;
  }
  .eval-panel-header {
    padding: 14px 20px;
    background: var(--navy);
    color: white;
    flex-shrink: 0;
  }
  .eval-panel-title { font-size: 14px; font-weight: 700; }
  .eval-panel-sub { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 2px; }
  .eval-body { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }

  .eval-section-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--gray-500);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--gray-100);
  }

  .eval-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .eval-field label { display: block; font-size: 11px; font-weight: 600; color: var(--gray-500); margin-bottom: 4px; }
  .eval-field input, .eval-field select {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--gray-200);
    border-radius: 6px;
    font-size: 13px;
    font-family: 'Pretendard', sans-serif;
    color: var(--gray-800);
    outline: none;
    transition: border-color 0.15s;
  }
  .eval-field input:focus, .eval-field select:focus { border-color: var(--blue); }

  .score-item {
    background: var(--gray-50);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 8px;
  }
  .score-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .score-item-name { font-size: 13px; font-weight: 500; color: var(--gray-700); }
  .score-item-max { font-size: 11px; color: var(--gray-400); }
  .score-slider-row { display: flex; align-items: center; gap: 10px; }
  .score-slider {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--gray-200);
    outline: none;
    cursor: pointer;
  }
  .score-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--navy);
    cursor: pointer;
    border: 2px solid white;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .score-input {
    width: 52px;
    text-align: center;
    padding: 4px;
    border: 1px solid var(--gray-200);
    border-radius: 4px;
    font-size: 14px;
    font-weight: 700;
    color: var(--navy);
    font-family: 'Pretendard', sans-serif;
  }

  .total-box {
    background: var(--navy);
    color: white;
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .total-label { font-size: 13px; font-weight: 600; }
  .total-score { font-size: 28px; font-weight: 700; color: var(--gold-light); }
  .total-score span { font-size: 14px; color: rgba(255,255,255,0.5); }

  .bohun-box {
    background: #fdf2f8;
    border: 1px solid #f9a8d4;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bohun-check { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .bohun-check input { width: 16px; height: 16px; cursor: pointer; }
  .bohun-check label { font-size: 13px; font-weight: 600; color: #9d174d; cursor: pointer; }
  .bohun-score-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .bohun-score-wrap label { font-size: 12px; color: var(--gray-600); }
  .bohun-score-wrap select {
    padding: 4px 8px;
    border: 1px solid #f9a8d4;
    border-radius: 4px;
    font-size: 13px;
    background: white;
    font-family: 'Pretendard', sans-serif;
  }

  .grade-select select {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--gray-200);
    border-radius: 6px;
    font-size: 13px;
    font-family: 'Pretendard', sans-serif;
    background: white;
  }

  .comment-area {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--gray-200);
    border-radius: 6px;
    font-size: 13px;
    font-family: 'Pretendard', sans-serif;
    resize: vertical;
    min-height: 70px;
    color: var(--gray-800);
  }

  .eval-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--gray-100);
    flex-shrink: 0;
    display: flex;
    gap: 8px;
  }

  .save-btn {
    flex: 1;
    padding: 11px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Pretendard', sans-serif;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--navy);
    color: white;
  }
  .save-btn:hover { background: var(--navy-light); }
  .save-btn.saved { background: var(--green); }
  /* 비활성화 시 스타일 정의 */
  .save-btn:disabled {
    background: var(--gray-300) !important;
    color: var(--gray-500) !important;
    cursor: not-allowed;
    opacity: 0.6;
  }

  .dashboard-view {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .dashboard-view.active { display: flex; }

  .dashboard-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .dashboard-title { font-family: 'Noto Serif KR', serif; font-size: 16px; font-weight: 700; color: var(--navy); }

  .stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat-card {
    background: white;
    border-radius: 8px;
    padding: 10px 14px;
    box-shadow: var(--shadow);
    border-left: 3px solid var(--navy);
  }
  .stat-card.green { border-left-color: var(--green); }
  .stat-card.gold { border-left-color: var(--gold); }
  .stat-card.red { border-left-color: var(--red); }
  .stat-label { font-size: 11px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 20px; font-weight: 700; color: var(--navy); margin-top: 2px; }

  .result-table-wrap {
    background: white;
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: visible;
    flex-shrink: 0;
  }
  .result-table-wrap .table-scroll {
    overflow-x: auto;
    overflow-y: visible;
  }
  .result-table-header {
    padding: 10px 16px;
    background: var(--navy);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .result-table-title { font-size: 13px; font-weight: 700; }
  .result-table { width: 100%; border-collapse: collapse; }
  .result-table th {
    padding: 7px 10px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--gray-500);
    background: var(--gray-50);
    border-bottom: 1px solid var(--gray-200);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .result-table td {
    padding: 7px 10px;
    text-align: center;
    font-size: 12px;
    border-bottom: 1px solid var(--gray-100);
    color: var(--gray-700);
  }
  .result-table tr:hover td { background: var(--gray-50); }
  .rank-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px; height: 26px;
    border-radius: 50%;
    font-weight: 700;
    font-size: 13px;
  }
  .rank-1 { background: var(--gold); color: var(--navy); }
  .rank-2 { background: var(--gray-300); color: var(--gray-700); }
  .rank-3 { background: #cd7f32; color: white; }
  .rank-other { background: var(--gray-100); color: var(--gray-500); }
  .remark-input {
    width: 100%;
    padding: 5px 8px;
    border: 1px solid var(--gray-200);
    border-radius: 4px;
    font-size: 12px;
    font-family: 'Pretendard', sans-serif;
    text-align: left;
  }

  .eval-detail-list { display: flex; flex-direction: column; gap: 12px; }
  .eval-detail-card {
    background: white;
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .eval-detail-card-header {
    padding: 8px 14px;
    background: var(--gray-50);
    border-bottom: 1px solid var(--gray-200);
    display: flex; align-items: center; gap: 8px;
  }
  .eval-detail-name { font-weight: 700; font-size: 13px; }
  .eval-detail-body { padding: 10px 14px; }

  .settings-view {
    flex: 1; overflow-y: auto; padding: 24px;
    display: none; flex-direction: column; gap: 20px;
  }
  .settings-view.active { display: flex; }
  .settings-card {
    background: white; border-radius: 10px; box-shadow: var(--shadow); padding: 20px;
  }
  .settings-card-title { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--gray-100); }
  .settings-field { margin-bottom: 14px; }
  .settings-field label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-600); margin-bottom: 6px; }
  .settings-field input {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--gray-200); border-radius: 6px;
    font-size: 13px; font-family: 'Pretendard', sans-serif;
    color: var(--gray-800); outline: none;
  }
  .settings-field input:focus { border-color: var(--blue); }
  .settings-help { font-size: 11px; color: var(--gray-400); margin-top: 4px; line-height: 1.5; }
  .settings-status {
    padding: 10px 14px; border-radius: 6px; font-size: 12px; font-weight: 500;
    margin-top: 10px;
  }
  .status-ok { background: #d1fae5; color: #065f46; }
  .status-warn { background: #fef3c7; color: #92400e; }
  .status-err { background: #fee2e2; color: #991b1b; }

  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    width: 440px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--gray-200);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-title { font-size: 16px; font-weight: 700; color: var(--navy); }
  .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--gray-400); line-height: 1; }
  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-field label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-600); margin-bottom: 5px; }
  .modal-field input, .modal-field select {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--gray-200); border-radius: 6px;
    font-size: 14px; font-family: 'Pretendard', sans-serif;
    color: var(--gray-800); outline: none;
  }
  .modal-field input:focus, .modal-field select:focus { border-color: var(--blue); }
  .modal-footer { padding: 14px 20px; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 8px; }

  @media print {
    @page { size: A4 landscape; margin: 12mm; }
    body { height: auto; overflow: visible; background: white; font-size: 11px; }
    .header, .tab-bar, .sidebar, .eval-view { display: none !important; }
    .dashboard-view { display: block !important; overflow: visible; padding: 0; }
    .dashboard-header .btn { display: none; }
    .result-table input { border: none; background: transparent; font-size: 10px; }
    .result-table th, .result-table td { padding: 5px 7px; font-size: 10px; }
    .table-scroll { overflow: visible !important; }
    .result-table { min-width: 100% !important; width: 100%; }
    .result-table-wrap { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; margin-bottom: 10px; }
    .eval-detail-card { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; margin-bottom: 8px; }
    .stat-cards { break-inside: avoid; }
    .stat-card { box-shadow: none; border: 1px solid #ddd; }
    .dashboard-title { font-size: 14px; }
  }

  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--gray-800); color: white;
    padding: 12px 18px; border-radius: 8px;
    font-size: 13px; font-weight: 500;
    transform: translateY(60px); opacity: 0;
    transition: all 0.3s; z-index: 9999;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--green); }
